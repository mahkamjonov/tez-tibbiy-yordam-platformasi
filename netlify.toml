# Netlify sozlamalari — statik sayt, faqat kerakli fayllar dist/ ga yig'iladi
[build]
  command = "node tools/prepare-dist.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Shriftlar kamdan-kam o'zgaradi — bir kunlik kesh
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
