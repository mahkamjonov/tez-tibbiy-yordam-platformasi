# /etc/nginx/sites-available/tez-tibbiy-yordam.uz  (→ sites-enabled ga symlink)
#
# Statik sayt nginx'dan, /api va /admin esa Node xizmatidan (127.0.0.1:3001).
# https (443) bloki `certbot --nginx` tomonidan avtomatik qo'shiladi.

server {
    listen 80;
    listen [::]:80;
    server_name tez-tibbiy-yordam.uz www.tez-tibbiy-yordam.uz;

    root /var/www/tezyordam-admin/site;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Node xizmati: API va admin panel ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
    location /admin {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Statik fayllar ---
    # Shrift va rasmlar kamdan-kam o'zgaradi — uzoq kesh. JS/CSS/HTML — har safar tekshiriladi (ETag), deploydan keyin eskirib qolmaydi.
    location /assets/fonts/ { expires 30d; }
    location /assets/ { expires 7d; }
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
