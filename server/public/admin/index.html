<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin · Tez Tibbiy Yordam Qalqonlari</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- Kirish ekrani -->
<div class="login-screen" id="login-screen">
  <form class="login-card" id="login-form">
    <div class="login-badge">🛡</div>
    <h1>Admin panel</h1>
    <p class="muted">Tez Tibbiy Yordam Qalqonlari</p>
    <label class="field">
      <span>Login</span>
      <input type="text" id="login-user" autocomplete="username" required autofocus />
    </label>
    <label class="field">
      <span>Parol</span>
      <input type="password" id="login-pass" autocomplete="current-password" required />
    </label>
    <div class="login-error" id="login-error" hidden></div>
    <button class="btn btn-primary" type="submit" id="login-btn">Kirish</button>
  </form>
</div>

<!-- Asosiy ilova -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="brand">🛡 <span>Admin panel</span></div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="drugs">Dorilar</button>
      <button class="tab" data-tab="documents">Hujjatlar</button>
      <button class="tab" data-tab="videos">Video darslar</button>
      <button class="tab" data-tab="settings">Sozlamalar</button>
    </nav>
    <button class="btn btn-ghost" id="logout-btn">Chiqish</button>
  </header>

  <main class="content">
    <section class="panel" id="panel-drugs" data-panel></section>
    <section class="panel" id="panel-documents" data-panel></section>
    <section class="panel" id="panel-videos" data-panel></section>
    <section class="panel" id="panel-settings" data-panel></section>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<!-- Forma oynasi (add/edit) -->
<dialog id="form-dialog" class="form-dialog">
  <form id="entry-form" method="dialog">
    <header class="form-dialog__head">
      <h2 id="form-title">Qo'shish</h2>
      <button type="button" class="icon-btn" id="form-close" aria-label="Yopish">✕</button>
    </header>
    <div class="form-dialog__body" id="form-body"></div>
    <footer class="form-dialog__foot">
      <button type="button" class="btn btn-ghost" id="form-cancel">Bekor qilish</button>
      <button type="submit" class="btn btn-primary" id="form-save">Saqlash</button>
    </footer>
  </form>
</dialog>

<script src="admin.js"></script>
</body>
</html>
